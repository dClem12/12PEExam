<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile</title><link rel="stylesheet" href="app.css"><link rel="icon" href="favicon.svg"></head><body><header class="top"><nav class="nav"><div class="brand"><span class="mark">PE</span><span>VCE PE Response Lab</span></div><div class="links"><a href="index.html">Home</a><a href="app.html">Dashboard</a><a href="practice.html">Practice</a><a href="exam.html">Exam</a><a href="results.html">Results</a><a href="pricing.html">Pricing</a><a href="faq.html">FAQs</a><a href="profile.html">Profile</a></div></nav></header><main class="wrap"><h1>Profile</h1><div class="grid2"><div class="card"><input id="name" placeholder="Name"><input id="email" placeholder="Email"><input id="school" placeholder="School"></div><div class="card"><h2>Subscription</h2><p id="sub"></p></div></div><div class="card"><button class="btn" id="download">Download data</button><button class="btn danger" id="del">Request deletion</button><button class="btn" id="logout">Log out</button></div></main><script>let d=JSON.parse(localStorage.getItem('pe13')||'{}'),u=d.user||{};name.value=u.name||'';email.value=u.email||'';school.value=u.school||'';sub.textContent=u.plan==='full'?'Full access until '+new Date(u.expiresAt).toLocaleDateString():'Free account';download.onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)]));a.download='my-data.json';a.click()};del.onclick=()=>alert('Deletion request recorded');logout.onclick=()=>{d.user=null;localStorage.setItem('pe13',JSON.stringify(d));location.href='index.html'}</script><footer class="foot">Independent educational prototype. Not affiliated with or endorsed by VCAA. Marks are indicative.<p><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a><a href="cookies.html">Cookies</a><a href="refunds.html">Refunds</a><a href="contact.html">Contact</a></p></footer><script src="site-shell.js"></script></body></html>
